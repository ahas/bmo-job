[package]
name = "queue-rows"
description = "The TODO's rows and work orders, written: an item filed, added to, approved, weighed, merged and closed, and a work order's lock."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
# A turn record kept, a memory filed and read, an instruction queued and a message read, on the units that
# own them.
job-agency.workspace = true
job-base.workspace = true
job-brain.workspace = true
job-codes.workspace = true
job-policy.workspace = true
job-receiver.workspace = true
# The owner's wording document, read for the terms set aside.
pulldown-cmark.workspace = true
queue-read.workspace = true
regex.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
# The queue a work order's lock is waited on in, within one process.
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
migration.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
