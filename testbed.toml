# How bmo-testbed tests, checks, builds and deploys this repository, in the testbed's declaration format
# (docs/deploy.md).
testbed = 0
name = "bmo-job"

# The Cargo workspace is tested as the root project. The TypeScript client in `package/` is a project of its
# own, found by its manifest and its lockfile, and checked and tested by its manifest's `check` script.
[test]
languages = ["cargo", "bun"]
setup = ["bun install --frozen-lockfile --cwd package"]

[check]
quick = ["layout", "dependencies"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

# The service's binary, which serves the API, starts the MCP server and prints the OpenAPI document, goes into
# a release's bin/.
[build]
binaries = ["bmo-job"]

# The service's own deploy tree, and the data root its settings stand under. The settings stand under the data
# root as env/bmo-job.toml, and each release links to them as settings.toml, the file the service reads in its
# working directory (docs/settings.md, "Where the file is").
[deploy]
root = "~/.local/share/bmo-job"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.toml", target = "env/bmo-job.toml" }]
# The service's user unit, marked bot: the repository's one service, which runs `bmo-job serve`.
units = ["deploy/*.service"]
