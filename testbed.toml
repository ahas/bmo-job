# How bmo-testbed tests, checks, builds and deploys this repository, in the testbed's declaration format
# (docs/deploy.md).
testbed = 0
name = "bmo-job"

# The Cargo workspace is tested as the root project. The TypeScript client in `package/` is a project of its
# own, found by its manifest and its lockfile, and checked and tested by its manifest's `check` script.
[test]
languages = ["cargo", "bun"]
setup = ["bun install --frozen-lockfile --cwd package"]

[check]
quick = ["layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
# The one address docs/PERSONAL-DATA.md allows.
personal_data_allowed = ["dev@ahas.io"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# The service's own tools, each checked by the command its tool.toml names.
[tools]
dir = "tools"

# The service's binary, which serves the API, starts the MCP server and prints the OpenAPI document, and the
# executables of its tools, go into a release's bin/.
[build]
binaries = ["bmo-job", "todo-tool", "state-tool", "launch-tool"]

# The service's own deploy tree, and the data root its settings stand under. The settings stand under the data
# root as env/bmo-job.toml, and each release links to them as settings.toml, the file the service reads in its
# working directory (docs/settings.md, "Where the file is").
[deploy]
root = "~/.local/share/bmo-job"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.toml", target = "env/bmo-job.toml" }]
# The service's user unit, marked bot: the repository's one service, which runs `bmo-job serve`.
units = ["deploy/*.service"]

# The binary, linked into `.local/bin` under the home directory beside `bmo`, which serves the nouns it
# declares from there (docs/deploy.md, "The unit command").
[[deploy.step]]
id = "link-command"
phase = "before-flip"
command = '''
set -eu
mkdir -p "$HOME/.local/bin"
ln -sfn "$HOME/.local/share/bmo-job/deploy/bin/bmo-job" "$HOME/.local/bin/bmo-job"
'''

# Each tool is placed in its folder's .placed/, the folder the tool host reads: the executable the release's
# bin/ holds, its manifest and the schemas beside it.
[[deploy.step]]
id = "place-todo-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/todo/.placed
mkdir -p tools/todo/.placed
cp bin/todo-tool tools/todo/tool.toml tools/todo/*.json tools/todo/.placed/
'''

[[deploy.step]]
id = "place-state-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/state/.placed
mkdir -p tools/state/.placed
cp bin/state-tool tools/state/tool.toml tools/state/*.json tools/state/.placed/
'''

[[deploy.step]]
id = "place-launch-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/launch/.placed
mkdir -p tools/launch/.placed
cp bin/launch-tool tools/launch/tool.toml tools/launch/*.json tools/launch/.placed/
'''

# Each placed tool registered with the tool host under this service's name, so every release carries its tools
# without a hand on the registry; the host's command stands in its own deploy tree.
[[deploy.step]]
id = "register-todo-tool"
phase = "after-health"
command = '''
set -eu
"$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket" put --service bmo-job --placed \
  --allow queue.read --allow room.tools tools/todo/.placed
'''

[[deploy.step]]
id = "register-state-tool"
phase = "after-health"
command = '''
set -eu
"$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket" put --service bmo-job --placed \
  --allow room.tools tools/state/.placed
'''

[[deploy.step]]
id = "register-launch-tool"
phase = "after-health"
command = '''
set -eu
"$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket" put --service bmo-job --placed \
  --allow room.tools tools/launch/.placed
'''

# This service's standing line in every agent's brain, declared once the service is up (the brain's
# docs/boundary-api.md, 「Declarations and holders」); a machine with no brain passes.
[[deploy.step]]
id = "holder-declare"
phase = "after-health"
command = '''
set -eu
brain="$HOME/.local/share/bmo-brain/deploy/bin/bmo-brain"
[ -x "$brain" ] || exit 0
"$brain" holder declare deploy/brain-holder.toml
'''

# The same set withdrawn from every agent's brain when the service is taken off this machine (the testbed's
# docs/deploy.md, 「Taking a repository off: `deploy remove`」); a machine with no brain passes.
[[deploy.step]]
id = "holder-withdraw"
phase = "removal"
command = '''
set -eu
brain="$HOME/.local/share/bmo-brain/deploy/bin/bmo-brain"
[ -x "$brain" ] || exit 0
"$brain" holder withdraw job
'''

# the release a person's machine runs, packed as an artifact (bmo-testbed's docs/artifacts.md)
[artifact]
