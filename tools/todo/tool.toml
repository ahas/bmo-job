# The service's TODO tool (docs/tools.md): the queue's two readings, the worker's and a person's, read through
# the service's own API, and the three filings — a row filed, words added, an approval given or taken back — run
# as the unit CLI's `todo` verb under the turn's agent and run. The crate's own test holds every entry here to the
# tool answering it.

[tool]
name = "todo"
protocol = 1
language = "rust"
build = 'cargo build --release -p todo-tool && cp "$BMO_CARGO_TARGET/release/todo-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p todo-tool'
run = ["todo-tool"]
timeout = 30

[[entry]]
namespace = "worker"
name = "todo_list"
title = "TODO list"
description = "The work queue in its own order. By default what is open: not finished, not set aside, not merged into another row."
input = "todo_list.json"
hints = { read_only = true }
capabilities = ["queue.read"]

[[entry]]
namespace = "worker"
name = "todo_show"
title = "TODO show"
description = "The whole of one item: what it was filed with, what was added since, its questions, its report and what it left."
input = "todo_show.json"
hints = { read_only = true }
capabilities = ["queue.read"]

[[entry]]
namespace = "bmo"
name = "todo_list"
description = "The work queue in its own order; by default what is open."
input = "bmo_todo_list.json"
output = "reading.json"
hints = { read_only = true }
capabilities = ["room.tools"]

[entry.bundle."room.chat"]
shown = ["all", "pending", "held", "merged"]

[[entry]]
namespace = "bmo"
name = "todo_show"
description = "The whole of one TODO item."
input = "bmo_todo_show.json"
output = "reading.json"
hints = { read_only = true }
capabilities = ["room.tools"]

[entry.bundle."room.chat"]
shown = ["item"]

[[entry]]
namespace = "bmo"
name = "todo_add"
description = "File a TODO row, out of the conversation or out of the agent's own judgement. Filing approves nothing."
input = "todo_add.json"
capabilities = ["room.tools"]
grant = "file_todo"

[entry.bundle."room.chat"]
shown = ["title", "what", "do", "conclusion"]
required = ["title", "what", "do"]

[[entry]]
namespace = "bmo"
name = "todo_append"
description = "Add words to an open TODO item; a running job is handed them before it reports."
input = "todo_append.json"
capabilities = ["room.tools"]
grant = "file_todo"

[entry.bundle."room.chat"]
shown = ["item", "text"]

[[entry]]
namespace = "bmo"
name = "todo_approve"
description = "Approve a TODO item into the queue, or take an approval back."
input = "todo_approve.json"
capabilities = ["room.tools"]
grant = "approve"
