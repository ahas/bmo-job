[package]
name = "launch-tool"
description = "The chat agent's launching entries for the tool host: a job filed on a worker and a research sent out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "launch-tool"
path = "src/main.rs"
test = false

[dependencies]
tool-call = { path = "../../crates/tool-call" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
