# The service's state readings (docs/tools.md): a room's jobs and an item's work order, each read through the
# service's own API and answered as the lines of the reading schema. The crate's own test holds every entry here
# to the tool answering it.

[tool]
name = "state"
protocol = 1
language = "rust"
build = 'cargo build --release -p state-tool && cp "$BMO_CARGO_TARGET/release/state-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p state-tool'
run = ["state-tool"]
timeout = 60

[[entry]]
namespace = "bmo"
name = "jobs"
description = "A room's job runs, newest first."
input = "jobs.json"
output = "reading.json"
hints = { read_only = true }
capabilities = ["room.tools"]

[[entry]]
namespace = "bmo"
name = "work_order"
description = "One item's work order: its state, its stages and each task."
input = "work_order.json"
output = "reading.json"
hints = { read_only = true }
capabilities = ["room.tools"]
