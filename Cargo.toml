# The workspace: the client the service publishes and its harness plugin under `crates/`, and the service's own
# package at the root, which holds the server, its store and the binary, and in `tests/` the repository checks,
# the server's request tests and the plugin's tests over the real server.
[workspace]
members = ["crates/client", "crates/plugin"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.8"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
bmo-job-client = { path = "crates/client" }
bmo-job-plugin = { path = "crates/plugin" }
clap = { version = "4.5.40", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.12.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
sse-stream = "0.2.6"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.8"

[package]
name = "bmo-job"
description = "A todo kept as middleware: items, notes, reports, work orders, queues, leases, questions and subscriptions, stored and served through one API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[[bin]]
name = "bmo-job"
path = "src/bin/bmo-job.rs"

[dependencies]
axum.workspace = true
bmo-job-client.workspace = true
bmo-job-plugin.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
url.workspace = true

[dev-dependencies]
# The request tests run the server on loopback over a scratch database, and stand a webhook receiver of their
# own beside it; the plugin's tests drive the `bmo-job mcp` command over its pipes against that same server.
axum = { workspace = true, features = ["http1", "tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
libc = "0.2.190"
regex.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
