# The workspace: the service's own package at the root, the two queue crates under `crates/` and the
# migration crate. The root package also holds the repository checks in `tests/`.
[workspace]
members = ["crates/queue-read", "crates/queue-rows", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-job"
description = "The TODO, work orders and the job queue as one service with its own API."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dev-dependencies]
toml.workspace = true
