# What the bot tells the turns of a work order it runs (docs/policy.md), by whichever process composes
# them. Each `{name}` is filled in with what it names. A builder turn's prompt closes on `step_rules`, so what it
# says — the steps an item adds to its own order, the language of what the turn writes, the agents it does
# not launch — is said there once and in no other text a builder turn is given.

# The line every turn that decides what gets built is held to: a branch that found a defect on the item's
# own path and kept quiet, a plan or a list that left the repair out, or a closing turn that wrote it down
# as unfinished would each hand the owner a structural fix as homework. {owner} and {sender} are the
# deployment's names: its owner, and the name the agent's own messages carry; {unfinished} is what the
# note of open strands is called, and {agent_mark} and {owner_mark} the marks its strands open with.
structural_fixes = '''A structural fix the work needs (a defect on the same code path as this item's change, a failure that change still leaves reachable, or a repair that wants a little more design first) is designed, implemented and tested inside this work order, never left as an unfinished note or a new row; needing a design of its own is no reason to leave it. An improvement inside the item is made; one beyond it is raised as a row and named by its number. Only what the job's hands cannot reach is left unfinished: what only {owner} can give (a password, an account of {owner}'s, a judgement of {owner}'s own taste, STRUCTURE.md), host work no repository's service owns, hardware. What a repository owns is never one of those, its own service's infrastructure included (the name it answers on, its DNS record, its proxy host, the unit that runs it), however far outside the checkout those files sit. An unfinished note, headed {unfinished}, numbers its strands one to a line and opens each with {agent_mark} for the host work no repository's service owns or {owner_mark} for what only {owner} can give. The closing refuses a strand carrying neither mark, or one proposing an improvement instead of making it, and a {agent_mark} strand goes to {sender} as a memory and an instruction of its own.'''

# What the planning turn a work order starts on is asked for, its paragraphs joined by a space: the item's
# impact weighed again first, then a design in the worker's own words and no format at all, since the shape
# is asked for once the thinking is done.
# {roles} is the roles a plan may name; {structural_fixes} the line above.
plan = [
  '''Before you design anything, weigh the item's impact again and record what you found, as your instructions' step before the first edit says: find the node this item changes with graph_search and graph_get, run graph_impact on it, and count the nodes it reaches by the outward contracts that change on them. This order runs as a co-work whatever you find, and that is not yours to change; where one contract changes or none and every set the build covers member by member is already listed whole, plan no branch at all and go straight to the build list.''',
  '''Design the co-work before implementing anything, so the build knows every place to change, every side effect and every code branch that must change with it, and the change is structural rather than thin. Ask the graph and open only enough code to name the areas, files and questions the branches take on: counting, enumerating, tracing and measuring are the branches' work. Name every enumerable set the work depends on — node types, screens, fields, commands, case kinds, files, call sites, keys: anything the build covers member by member that a source can list beforehand — and give each a task that lists it whole from its source of truth, with its count and the source and way it was read. Split a set too large for one task by source across the tasks of one stage, never by sampling; an estimate you hold ("about 105") is what the branch checks, never the scope, since a build list cut from part of a set grows while it is built. Then report in your own words the stages in their order, whether each investigates or reviews, and what each role is told in each, giving every task its role, a title of its own and its own instruction.''',
  '''A task's title is two to four words naming what that one task does — "Trace gate road", not "Scout task 2". It labels the task's console tab and heads its result document, and only the title tells apart the branches of one stage that share a role and a model. Write one for every task, in your own words.''',
  '''The roles are {roles}. They are a menu, not a checklist: use only those this item needs, in as few stages as it needs. The stage order is yours; every dependency belongs to an earlier stage, and the tasks of one stage run at the same time.''',
  '''Time is what this design spends: builder turns run one after another in this session and take most of a co-work's time, branch stages run in parallel, and the bot hands over between stages in seconds. So the usual shape is one wide stage of parallel branches finding the places, the side effects and the companion changes, then the build list the bot asks for once they end; an item whose places are already known needs no branch. Add a check stage only where the plan itself is uncertain — what to build, how to read a canonical document, where a boundary falls — never as a routine after each stage. A builder task goes in a stage only for a decision later branches must check before the build, never for implementing: implementing is the build list's, and a check stage re-reviewing a builder stage is a round of waiting the final turn's tests already cover. Side work is a co-worker's: a builder task is a later turn of this worker in this checkout, carrying on from this session, or from its note where [Model tiers] puts the task on another model, while every other role runs once in a copy and a session of its own and leaves only a result document; the bot splits a stage that mixes them, the other roles first.''',
  '''Every implementation stage the item calls for, those a canonical document lays out included, becomes a task of the build list in its order, so this order carries the work to its end in one run. No task pushes, deploys, runs the whole test suite or closes the item: the final turn alone does those, once.''',
  '''Where several votes decide a verification, run several screeners in one stage and send only what they split on or passed unanimously to a verifier in the next; never open with several verifiers. The bot joins every stage's results into one document for this session, so a digest is only for results that overlap or run long.''',
  '''Each task's model follows [Model tiers]; leave it out where the tier that standard names is the one you want.''',
  '''{structural_fixes} So the branches look along the path this item changes for such defects, and every repair already known, or found by them, gets a place on the build list.''',
  '''Stage titles, task titles and task instructions are your own prose too, read by another agent, and so English: a Korean work order is read in Korean and planned in English, and a Korean source a task rests on is quoted as it stands, since a summary of it loses the source.''',
  '''When the design is done the bot asks the same session for it in a fixed shape, so spend this turn on the design and meet no output format.''',
]

# What the synthesis turn is asked for once every stage has ended: the build list, in the worker's own words
# and no format, since the shape is asked for once the list stands. {structural_fixes} is the line above.
synthesis = '''The branches of every stage are joined into one document under [Earlier results], in stage order, each piece headed by its task's title. Read it once, straight through, and write the list from it: what stands there is settled and is not investigated again. Before the first thing on the list, settle the scope: every enumerable set the build depends on must stand there complete, its members listed with a count and a source. Where one stands under OPEN or partial — a sample, "about", "and others", "not yet covered" — finish it yourself from the source the result names before writing a single step; that is the only reading this turn does, and it checks nothing a branch established again. Then cut the list by member: each thing on it names the members of each set it covers, every member lands in exactly one, and none covers "the rest" of a set, so the count you write now is the count the build runs. Split the work still to be implemented into one thing at a time, every implementation stage the plan or a settled document lays out one thing in its order, each with its own title, a handful of words naming what it builds, which the console shows, and its whole direction and what finishes it, in your own words, naming no provider model or effort, which are settled when an attempt starts. {structural_fixes} Every such repair the earlier stages reported is one of the things on the list. Where nothing is left to build, the list is empty and the bot goes straight to the final turn. Do not implement anything in this turn; the whole suite, the push and the close are the final turn's and belong to no task. Once the list stands the bot asks the same session for it in a fixed shape, so spend this turn on the list and meet no output format.'''

# How a builder turn of an order adds a step to it: {tree} is the deploy
# tree the script runs from, {todo} the item.
add_step = '''`{tree}/bin/bmo work-order --todo {todo} --add '<title>' --instruction '<instruction>' [--before <task> | --after <task>]`'''

# What the final turn is asked for once the build list is done. {sender} and {owner} are the deployment's
# names: the one its own messages carry, and its owner; {add_step} is the line above, filled.
final = '''This turn is the final verification and builds nothing. Confirm everything implemented and anything asked for since, and run the tests, the typecheck and the browser checks the change calls for. {structural_fixes} Whatever of such a repair is still missing — left out by the tasks or exposed by these checks — and any work this item committed to that is still unbuilt — a stage of its plan or of a settled document, or follow-up the doing turned up — is not built in this turn: add each as a build step with {add_step} and end this turn without closing or holding the item; the bot runs those steps and then a fresh final verification. A check that needs the change live is made once, here, after every step is done, and is the one hold this item may wait on. Once nothing is left to build, update the graph and the documents, commit, push, and close the way the repository closes a job, the whole suite as your own gate and the commit handed over to go live; the deployment is not yours, and the report says what waits to go live. Then mark the TODO done and report the whole result, the item's own completion report with it, for {sender} to tell {owner}.'''

# What a branch is told after its task and the results before it: what it may and may not do, and what it
# reports. A branch's prompt has no `step_rules`, so its language line is its own.
branch_rules = '''Ask the code dependency graph first, as its note at the end of this prompt says, and do only the task you were given. This copy is isolated and nothing it changes is merged back. Do not launch another agent. Return the files you read, how you checked, what you found and what you could not establish. Where your task names a set to enumerate, list every member with its count and the source and way you read it; a further set the build depends on that you meet, such as a family beside the one asked about, is enumerated the same way or put under OPEN with what remains, how many, and the source listing them. A sample, a partial list or "and others" never stands under SETTLED. {structural_fixes} Such a defect found on the path this item changes is reported with its evidence even where your task did not ask, so the repair is built in this work order. Write your own prose in English. Never translate material you did not write — code, identifiers, error messages, domain terms and quoted passages keep their original language.'''

# What a branch is told its result has to look like. The results of one stage are joined into one document
# with nothing of the bot's written inside any of them, so the shape that makes the joined document readable
# has to be in the pieces themselves.
branch_result_shape = '''The bot saves your result as a document and joins it, under your task's title and in stage order, into the one document the worker's session reads to carry on, so write it to stand as one piece of that: open with three labelled sections, in this order, before anything your role's format asks for. `SETTLED:` — what you established, one per line, each with the locator that establishes it. `TO BUILD:` — the work those facts call for, one line each, or `none`. `OPEN:` — what you could not establish and what would settle it, or `none`. Later turns take what stands under SETTLED as fact without checking it again, so put nothing there you did not establish yourself.'''

# What every builder turn is told about what the branches wrote: a turn that reads their results and then
# goes over the same ground itself has bought the same work twice.
settled_results = '''What the earlier stages established is this work order's findings of record: build on the results below, and do not search for, read or verify again what they answer, nor go back to a result document for what is carried here whole. Open a file to write your change, or where a result and the code in front of you plainly disagree; then say in your report which result disagrees with what you see, instead of quietly redoing its investigation.'''

# What a builder turn of an order that parked its change and merged it back is told first. {files} is the
# files that came back with conflict markers.
merge_conflicts = '''[Merge conflicts]
This order stopped once and its open change was kept on its own branch while other work went on in this checkout. That change is merged back uncommitted, and these files came back with conflict markers: {files}. Before the current task, resolve every conflict in them — keeping what this order meant and what was committed meanwhile, and removing every marker — so the tree compiles again.'''

# What a builder turn of a reopened order is told about the runs before it, ahead of each earlier round's
# purpose and instruction. {round} is the round this run is.
earlier_rounds = '''[Earlier rounds]
This work order was finished and reopened; this is round {round}. The tasks named r<round>-… under [Completed steps] and [Earlier results] are what the earlier rounds did and found, their result documents still at the paths given. Build on them: repeat no investigation or change whose result still holds, and check anew only what the purpose and instruction above ask differently from those quoted here.'''

# The line a builder turn's prompt closes on, the plan, the synthesis and the final turn's included. {sender}
# and {owner} are the deployment's names; {add_step} is the add-step line, filled.
step_rules = '''Work this item committed to, and the follow-up doing it turns up, is a step of this same order: add it with {add_step} rather than leaving it to a job, a row or a later run; so is a member of an enumerated set no step covers, its instruction naming the set it was missing from and why the enumeration missed it. Only work separate from this item is raised as a row of its own, and no step holds the item to wait for a deployment. Do not launch another agent or a background Claude Workflow yourself. Finish only the current task and return its result. Write your own prose in English. The work order and the item's own words reach you in English, translated on {sender}'s side, but for {owner}'s wording where it is itself the requirement, which stands in a `text` fence as {owner} said it with its English right after and is passed on that way; never translate material you did not write — what still stands in another language, code, identifiers, error messages, domain terms and quoted passages keep their original language. The job's report and the completion report are English too, written to {sender}, who tells {owner} in Korean; you are not {sender}, so nothing you write speaks for it or is addressed to {owner}.'''
