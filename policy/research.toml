# A research run's own settings and the checks each of its fields must pass (docs/policy.md): the search
# depths and the browse runner, one row each in the archive.

# Every research key, in the order the screen lists them.
keys = ["search:basic", "search:thorough", "search:exhaustive", "browse"]

# The keys held to a ceiling and a research close. A search has no clock: it runs until it has written
# its result and is never cut off at a time.
clocked = ["browse"]

# The keys that open no branches at all.
branchless = ["search:basic"]

# The ways a page is fetched: a search's, and the browse runner's.
search_strategies = ["direct-then-browser", "browser-first", "direct-only"]
browse_strategies = ["visible", "headless"]

# The most places one pool bucket may hold.
pool_capacity_most = 128

# The capabilities a run's research settings open, each with the run variable that opens it: the
# variable opens its capability where it names at least one comma-separated item other than "0", and a
# run carrying no research setting at all holds none of them. Both launchers read this table and leave
# what it withholds out of the session record.
[opens]
"web.images" = "BMO_RESEARCH_IMAGES"
"web.branches" = "BMO_RESEARCH_TOOLS"
"web.rulebooks" = "BMO_RESEARCH_RULEBOOKS"

# What each field of a profile is held to, in milliseconds and counts: the ceiling of a clocked run, the
# synthesis kept inside it, the research it must still leave, the branches, the wait for a pool place
# and the pause between two requests to one host or one engine.
[limits]
cap_ms = { min = 30000, max = 7200000 }
synthesis_reserve_ms = { min = 10000 }
research_ms = { min = 10000 }
max_children = { max = 16 }
wait_limit_ms = { max = 3600000 }
interval_ms = { max = 60000 }

# What a search run's standing instructions carry after its task: the rulebooks a search is bound by, in
# this order, each named as it stands under the rules; the ones binding only some searches, which are
# given by the one section deciding whether each applies and read whole from the web server once it says
# it does; and that section's heading.
[search]
rulebooks = ["search-kinds", "product-search", "restaurant-search", "investment-search", "study-material", "deep-dives"]
on_request = ["product-search", "restaurant-search", "investment-search", "study-material", "deep-dives"]
applies_section = "Whether this rulebook applies at all"
