# What the closing of a TODO item reads the words it writes by (docs/policy.md): the strands of an
# unfinished note and whose each is, the lines of a report's section of what it left or of a strand that
# propose or defer an improvement instead of making it, and the lines that leave a check undone. The
# strands and the English set-aside are read by the bot and by `bmo todo` alike, the leftovers by `bmo
# todo`, the unchecked lines by `bmo todo` and the job runner; each pattern is a regular expression either
# side compiles, with the flags written beside it.
#
# A pattern's `{names}` is the owner's name or the agent's, and `{owner}`, `{agent}`, `{share}` and
# `{unfinished}` the words they name, each filled in escaped. The words of the deployment's language stand
# under `[words]` at the end.

# The strands of an unfinished note: the opener a listed strand starts with, and the mark saying whose it
# is, the name in its first group. The mark a strand handed over is written back with, by whose it is. An
# owner strand matching the host-work words is refused unless it names what only the owner can give, by
# the leftovers' owner-only words or the unchecked lines' beyond-reach ones.
[strands]
opener = '^\s*(?:\d+[.)]|[-*•])\s+'
mark = '^[*_\s]*({names})[\s*_]*{share}[*_\s]*[:：][*_\s]*'
agent_mark = "{agent} {share}:"
owner_mark = "{owner} {share}:"
host_work_flags = "i"

# A report's own section of what it left, by its heading, and what in it or in a strand proposes an
# improvement: what only the owner can give and a row already raised are no proposal, and any of the
# proposing patterns is.
[leftovers]
owner_only_flags = "i"
raised_row_flags = "i"

# A line of a report or a strand that says a check was left undone: any of the patterns, outside the
# line's quoted spans, unless the line names what puts the check beyond a job's reach now. The closing
# refuses such a line with the refusal, and the job runner names it under the report it hands the agent
# with the note.
[unchecked]
beyond_reach_flags = "i"
refusal = "a report or an unfinished note never leaves undone a check a job could make. Check each line below now, by whatever this machine gives (sudo, a package installed, the real path run, the code, the maker's issues and pull requests), and write the value; a capability nobody confirmed is checked first, used and measured where it exists, ported or patched into our own engine where it does not. A line stays only where it names what puts the check beyond any job's reach now (a permission only {owner} holds, hardware not yet in the lab). These lines leave a check undone:"
note = "The report leaves checks undone with nothing putting them beyond a job's reach; settle each before telling it:"

# The words a reason or a record is read past when it is asked whether it is written in English: the names
# and the terms a line in another language and an English one carry alike, and the Latin letters each
# Hangul syllable left is read past against.
[english]
set_aside = '({names}) {share}|{names}|{unfinished}'
latin_per_hangul = 20

# A report's own part naming the graph nodes its change reached and how each was verified: the heading a
# line opens the part with, `{impact}` one of the impact words, and the tool whose calls the job's record
# is read for. The runner asks a job whose own commits touched files the graph names for both.
[impact]
heading = '(?m)^[#*_\s]*({impact})[*_\s]*[:：]?[*_\s]*$'
heading_flags = "i"
tool = "graph_impact"

# The words of the deployment's language the closing reads and writes by. A deployment gives its own under
# `[words.closing]` in its settings, each key taking the place of the one here whole.
[words]
# The word a strand's mark names whose it is by, after the name.
share = "share"
# What the note listing a closed item's open strands is called.
unfinished = "Unfinished"
# The headings of a report's own section of what it left.
left_headings = ["Left"]
# The words a report's impact part is headed by.
impact = ["impact"]
# What a strand reads as host work by, which is never the owner's.
host_work = '\b(sudo|sysctl|systemctl|apt|apt-get|dpkg|fstab|mounts?|umount|reboot|firewall|ufw|iptables|cron|crontab|udev|modprobe|grub|kernel|router|backups?|packages?|install|installed|installs|installing|nfs|samba|smb|dns)\b|\bunit (file|link)s?\b|proxy host|port forward'
# What only the owner can give, and a row already raised.
owner_only = 'password|account|taste|STRUCTURE\.md'
raised_row = '#\d+[^\n]*(raised|filed)|(raised|filed)[^\n]*#\d+'
# What puts a check beyond any job's reach now.
beyond_reach = 'only {owner}|({owner}|the owner)[\x27’]s (own )?(permission|password|account|login|admin)|only (the owner|{owner}) (holds|has|can)|(hardware|device|equipment|card|NIC|machine)[^\n]{0,60}not (yet )?(here|present|installed|delivered|bought|arrived|in the lab)|not yet in the lab|real (handset|device)|own taste'
# A line proposing or deferring an improvement instead of making it.
proposing = [
  { pattern = '\b(suggest|propos|recommend)', flags = "i" },
  { pattern = '\b(could|should|might) (also |later )?(be|add|use|move|change|make|give)', flags = "i" },
  { pattern = '\b(would be (better|nicer|cleaner))|\bworth (doing|trying|adding)|\bfollow-?up\b|\bin (a )?later (job|pass|item)|\bfuture (job|work|pass)', flags = "i" },
  { pattern = '\b{owner}(\x27s)?\s+(share|decision|call|judgement|choice)\b|\b(up to|for) {owner} to (decide|choose|judge)', flags = "i" },
]
# A line leaving a check undone.
unchecked = [
  { pattern = '(\bnot|\bnever|n\x27t)\s+(yet\s+)?(been\s+)?(checked|verified|measured|confirmed|tested|reproduced|benchmarked)\b', flags = "i" },
  { pattern = '\b(could\s*not|couldn\x27t|cannot|can\x27t|unable\s+to|failed\s+to)\s+(be\s+)?(read|check|verify|measure|confirm|test|reproduce)', flags = "i" },
  { pattern = '\b(unchecked|unverified|unmeasured|unconfirmed|untested)\b', flags = "i" },
  { pattern = '\bonly\s+(by|in|with|through|via)\s+(a\s+|the\s+)?(unit|integration|mock)\b|\b(unit|mock)[- ]tests?\s+only\b', flags = "i" },
  { pattern = '\b(needs?|requires?|requiring|would\s+need)\s+(root|sudo|admin(istrator)?\s+(rights|privileges))\b', flags = "i" },
]
