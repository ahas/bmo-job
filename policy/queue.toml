# The job queue's declared limits (docs/policy.md), read by whichever process is the chat receiver.

# How long the owner may hold a job's question clock stopped from the console, in seconds. A minute is
# short for reading while the owner is there; a stop still ends, because a job standing still holds its
# checkout's lock and everything queued on that checkout waits behind it. One line of talk over a
# question holds its clock as long.
question_stop_seconds = 1800

# How many files one word to a worker carries: as many as the console's box lets one send carry.
word_files = 10

# The model a stopped work order's last retry runs on where the archive setting `work_retry_model`
# names no Claude Code model: another model, so what one model's safeguard blocks again and again may
# pass.
work_retry_model = "claude-opus-4-8"

# The tier a builder task in a work order's stage runs at where its plan named none: every stage comes
# before the build and a review stage after it checks what it decided with a cheaper role, so the order's
# own model is kept for the build.
stage_builder_tier = "Reliable"
