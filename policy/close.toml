# What a job's close says (docs/policy.md): the lines `bmo job close` writes while it stands in the
# repository's close line, checks and lands, its refusals, the static check's lines and the test count's.
# A job reads them, so they are English. Each `{name}` is filled in with what it names.

[usage]
close = "usage: bmo job close --then '<why this goes live, in English>' [--skip-suite '<why, in English>']"
skip_reason = "job-close: --skip-suite takes the reason the change reaches nothing the suite runs"
count = "usage: bmo test count [--since <commit>]"

# The lines the close writes about itself, each opening with the verb's name.
[close]
name = "job-close"
said = "job-close: {line}"
refused = "job-close: refused — {why}"
node_branch = "on a work node a close runs on the job's work/ branch, which it lands"
line_gone = "job-close: not run — its job ended while it waited in the close line"
line_came = "job-close: the close line came after {seconds}s"
turn_gone = "job-close: not run — its job ended while it waited for the machine's turn"
check_again = "job-close: {main} moved while the close checked; checking the rebased commit again from {from}"
node_dropped = "job-close: {machine} dropped the suite; running it here"
# The landing, {count} the commits it put on main: `one`, `many`, or nothing where it put none.
landed = "job-close: landed {commit} on {main}{count} and pushed it"
one = " (1 commit)"
many = " ({count} commits)"
set_up = "job-close: {at} stands on {main} and its installs moved, so it was set up again"
set_up_failed = "job-close: {at} stands on {main} and its installs moved, but its setup failed — run bun run worktree:setup there: {fault}"
# What the check again found, {said} the suite's verdict or what stands for it, with the failed {files}.
failed_files = "; failed files: {files}"
log = " (log: {log})"
no_verdict = "suite: no verdict was written (exit {code})"
home_silent = "the operations machine said nothing of the landed commit"
unrecorded = "the commit could not be written down"
flaky_unwritten = "{record}, which could not be written ({why})"
recorded = "waiting to go live: {words}"
# A tree whose own `bmo` did not build, by the {code} its build ended with.
unbuilt = "job-close: FAILED — this tree's bmo did not build (exit {code}), so nothing was checked or handed over"

# What goes into git is English only: a reason or a commit message is read past the names of address
# alone, `{names}` the owner's name or the agent's, and a single Hangul syllable left refuses it.
[english]
set_aside = '{names}'
latin_per_hangul = 0

# The refusals of a reason or of the job's own commits holding Hangul, {flag} the reason's option, {main}
# the branch the commits stand past and {commits} each as `commit` names it, joined.
[language]
reason = "--{flag} holds Hangul; what goes into git is English only, the names of address {owner} and {agent} alone standing as they are"
commits = "these commits hold Hangul, and what goes into git is English only: {commits}. Reword each in English (git commit --amend for the last, git rebase -i {main} for an earlier one) and close again"
commit = "{hash} {subject}"
joiner = "; "

# Why a tree is not handed over.
[tree]
no_commit = "the working tree is on no commit at all"
not_pushed = "{head} is not on {remote}; an unpushed commit is not deployable"

# The gate: the static check, the suite, and what came of them. {name} is the close's name and {stopped}
# what was not done.
[gate]
stopped = "nothing was handed over to go live"
check = "{name}: the static check, its output in {log}"
check_not_run = "{name}: not run — the static check's turn did not come within its wait, so {stopped}; run this again at once"
check_failed = "{name}: FAILED — the static check did not pass, so {stopped}; mend it and run this again"
skipped = "{name}: the suite is skipped — {why}"
suite = "{name}: the suite over the packages the change selects, its log in {log}"
unfinished = "{name}: not finished — {count} never started within the suite's guard and none failed, so {stopped}; run this again at once"
suite_not_run = "{name}: not run — the suite's turn did not come within its wait, so {stopped}; run this again at once"
once_more = "{name}: the suite did not pass; what failed or never started runs once more: {files}"
flaky = "{name}: {tests} failed and then passed when run once more, so written down as flaky in {record}"
failed_files = "failed files: {files}"
suite_failed = "{name}: FAILED — the suite did not pass, so {stopped}; mend it and run this again"
deployed = "this commit is already what is deployed"
waiting = "this commit is already waiting to go live"
handed = "job-close: ok — {handed}, so nothing was run"
passed = "the suite passed"
was_skipped = "the suite was skipped"
not_landed = "job-close: FAILED — {what}, but the branch did not land: {refused}"
done = "job-close: ok — {what}; {record}"
flaky_named = "; flaky, passed only when run once more — name each in your report, for an item to mend it: {tests}"

# The close's hold on the wide lane through each part of its check.
[stretch]
command = "the close's check"
front_first = "close: lets a deployment waiting at the front take the machine's turn first"
held = "close: the machine's turn {words}; held through the check"

# The repository's close line, {who} where it stands: its job's place and its checkout joined, or its pid.
[line]
waiting = "close line: waiting for the repository's close line ({seconds}s so far): {ahead} ahead, {holder}"
nobody = "nobody holding it yet"
held_by = "held by {who}"
joiner = " · "
pid = "pid {pid}"

# The static check's lines, {step} a step as `step` names it.
[check]
step = "{name} ({command} in {dir})"
ended = "static check: {step} — exit {code}, {times}"
not_run = "static check: not run"
not_had = "{mark} — {step} did not get its turn within its wait; run this again at once"
failed = "static check: FAILED — {step} exited {code}"

# The test count, its lines and its refusal.
[count]
failed = "test count: {why}"
unaccounted = "test count: removed with no replacement and no retirement reason — {tests}. A Rust test replacing one names its title; a commit retiring one carries a line `Retired-test: <title> — <reason>`"
test = "{file}: {title}"
joiner = "; "
unreadable = "{file} at {end} could not be read: {why}"
start = "the range's start"
head = "HEAD"
