# The service's settings (docs/settings.md). A deployment gives its own as `settings.toml`, which git ignores,
# or names another file in BMO_JOB_SETTINGS.

[server]
listen = "127.0.0.1:7841"
token_file = "/srv/job/token"

# Callers with tokens of their own. An approval is recorded under the caller its token names, and opens a draft
# only where that caller approves; any other caller's approval is a recommendation.
[callers.qa-admin]
token_file = "/srv/job/qa-admin.token"
approves = true

[callers.tester]
token_file = "/srv/job/tester.token"

# The caller whose token the supervisors of the work carry: it alone settles a question put to the supervisor, or
# puts one to a person.
[callers.lead]
token_file = "/srv/job/lead.token"
supervises = true

# The labels whose items open by themselves, with no approval, and carry a note saying so.
[unattended]
labels = ["lane=pr-review"]

[database]
url = "sqlite://job.db?mode=rwc"
